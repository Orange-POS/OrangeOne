<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Getting Started with OrangeOne</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../../assets/fonts/Inter.ttf') format('truetype');
    font-weight: 100 900;
  }
  :root {
    /* OrangeTheme palette (lib/shared/theme/orange_theme.dart). */
    --brand: #FF8A33;
    --dark: #BE4602;
    --action: #F56600;
    --ink: #202124;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--dark); }
  body { font-family: 'Inter', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .abs { position: absolute; will-change: transform, opacity; }

  /* OrangeTheme.gradient: Alignment(-.54,-.72) -> (1,.6), stops .08/.94. */
  #bg { inset: 0; background: linear-gradient(118deg, var(--dark) 8%, var(--brand) 94%); }
  .orb { border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.13), rgba(255,255,255,0) 70%); }

  /* Logo: the supplied mark without its text, in the app's white tile. */
  .logo-tile {
    position: absolute; background: #fff; border-radius: 27%; border: 2px solid rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 24px 50px rgba(90, 30, 0, .28);
  }
  .logo-tile img { width: 84%; height: 84%; }

  /* Title cards */
  .card-screen { left: 0; top: 0; width: 1920px; height: 1080px; text-align: center; }
  .big { position: absolute; left: 0; right: 0; font-weight: 700; letter-spacing: -1.5px; }
  .big span { display: inline-block; white-space: pre; }
  .sub { position: absolute; left: 0; right: 0; font-size: 40px; font-weight: 500; opacity: .95; }
  .need { position: absolute; top: 470px; width: 560px; height: 300px; border-radius: 36px; background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.32); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .need .icon { width: 128px; height: 128px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
  .need .label { font-size: 36px; font-weight: 600; line-height: 1.25; padding: 0 30px; }

  /* Left panel */
  #panel { left: 150px; top: 0; width: 860px; height: 1080px; }
  #chapterNo { position: absolute; top: 300px; font-size: 30px; font-weight: 700; letter-spacing: 4px; padding: 12px 26px;
    border-radius: 999px; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.35); }
  #chapterTitle { position: absolute; top: 382px; font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 1.05; }
  #caption { position: absolute; top: 528px; width: 800px; font-size: 46px; line-height: 1.3; font-weight: 500; }
  #caption b { font-weight: 700; background: rgba(255,255,255,.22); padding: 0 10px; border-radius: 10px; }
  #brandRow { position: absolute; top: 120px; display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 600; }
  #brandRow .logo-tile { position: relative; width: 64px; height: 64px; box-shadow: none; }
  #progress { left: 150px; top: 930px; width: 760px; height: 10px; display: flex; gap: 12px; }
  .seg { flex: 1; border-radius: 5px; background: rgba(255,255,255,.28); overflow: hidden; }
  .seg i { display: block; height: 100%; width: 0; background: #fff; border-radius: 5px; }

  /* Phone: screen 444 x 961 (390 x 844 logical at 1.1385). */
  #camera { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #phone {
    left: 1124px; top: 45px; width: 472px; height: 989px; border-radius: 64px;
    background: linear-gradient(145deg, #3a3a3e, #121214 40%, #2a2a2e);
    padding: 14px; box-shadow: 0 40px 90px rgba(70, 20, 0, .4), inset 0 0 0 3px rgba(255,255,255,.08);
  }
  #screen { position: relative; width: 444px; height: 961px; border-radius: 51px; overflow: hidden; background: #fff; }
  .slot { position: absolute; left: 0; width: 444px; overflow: hidden; }
  .slot img { position: absolute; left: 0; width: 444px; height: 961px; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #statusbar { position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 4px 40px 0 52px; font-size: 19px; font-weight: 600; color: #fff; }
  #island { position: absolute; top: 13px; left: 50%; width: 142px; height: 41px; margin-left: -71px; background: #000; border-radius: 21px; }
  #homeInd { position: absolute; bottom: 9px; left: 50%; width: 158px; height: 6px; margin-left: -79px; border-radius: 3px; }

  .finger { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
    background: rgba(255,255,255,.42); border: 4px solid #fff; box-shadow: 0 8px 26px rgba(0,0,0,.28); }
  .ripple { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid #fff; }
  .hl { position: absolute; border-radius: 16px; border: 4px solid #fff; box-shadow: 0 0 0 3000px rgba(20, 8, 0, .45), 0 0 26px rgba(255, 138, 51, .9); }
  .hl-label { position: absolute; left: 0; white-space: nowrap; padding: 8px 18px; border-radius: 999px; background: #fff; color: var(--dark); font-size: 21px; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,.22); }
  .scanline { position: absolute; height: 5px; border-radius: 3px; background: linear-gradient(90deg, rgba(255,138,51,0), #FF8A33 20%, #fff 50%, #FF8A33 80%, rgba(255,138,51,0)); box-shadow: 0 0 20px 5px rgba(255,138,51,.75); }
  .flash { position: absolute; border-radius: 18px; border: 5px solid #fff; box-shadow: 0 0 36px 8px rgba(255,255,255,.7); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div>
  <div class="abs orb" id="orb1" style="width:1100px;height:1100px"></div>
  <div class="abs orb" id="orb2" style="width:800px;height:800px"></div>
  <div class="abs orb" id="orb3" style="width:600px;height:600px"></div>

  <!-- Intro -->
  <div id="intro" class="abs card-screen">
    <div class="logo-tile" id="introLogo" style="left:860px;top:250px;width:200px;height:200px"><img src="../brand/logo_mark_500.png" alt=""></div>
    <div class="big" id="introTitle" style="top:520px;font-size:104px"></div>
    <div class="sub" id="introSub" style="top:680px">A quick tour for new users</div>
  </div>

  <!-- Before you start -->
  <div id="need" class="abs card-screen">
    <div class="big" id="needTitle" style="top:300px;font-size:80px">Before you start</div>
    <div class="need" id="need1" style="left:370px">
      <div class="icon">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#F56600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/>
          <path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/>
          <path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>
        </svg>
      </div>
      <div class="label">The login QR code<br>on your POS</div>
    </div>
    <div class="need" id="need2" style="left:990px">
      <div class="icon">
        <svg width="76" height="76" viewBox="0 0 24 24" fill="#F56600"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      </div>
      <div class="label">Wi-Fi on the same<br>network as the POS</div>
    </div>
  </div>

  <!-- Chapters -->
  <div id="panel" class="abs">
    <div id="brandRow"><div class="logo-tile"><img src="../brand/logo_mark_500.png" alt=""></div>Getting Started with OrangeOne</div>
    <div id="chapterNo"></div>
    <div id="chapterTitle"></div>
    <div id="caption"></div>
  </div>
  <div id="progress" class="abs"></div>

  <div id="camera" class="abs">
    <div id="phone" class="abs">
      <div id="screen">
        <div id="slots"></div>
        <div id="fx"></div>
        <div id="statusbar">
          <span>9:41</span>
          <svg width="90" height="21" viewBox="0 0 112 26" fill="#fff">
            <rect x="0" y="16" width="6" height="8" rx="2"/><rect x="9" y="12" width="6" height="12" rx="2"/>
            <rect x="18" y="7" width="6" height="17" rx="2"/><rect x="27" y="2" width="6" height="22" rx="2"/>
            <path d="M52 9a17 17 0 0 1 22 0l-2.6 2.8a13 13 0 0 0-16.8 0z"/><path d="M56.5 14a10 10 0 0 1 13 0L67 16.8a6 6 0 0 0-8 0z"/><circle cx="63" cy="21" r="2.6"/>
            <rect x="80" y="4" width="28" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2" opacity=".55"/>
            <rect x="83" y="7" width="20" height="12" rx="2.5"/><rect x="109.5" y="10" width="2.5" height="6" rx="1" opacity=".55"/>
          </svg>
        </div>
        <div id="island"></div>
        <div id="homeInd"></div>
      </div>
    </div>
  </div>

  <!-- Outro -->
  <div id="outro" class="abs card-screen">
    <div class="logo-tile" id="outroLogo" style="left:870px;top:250px;width:180px;height:180px"><img src="../brand/logo_mark_500.png" alt=""></div>
    <div class="big" id="outroTitle" style="top:500px;font-size:110px">You’re all set!</div>
    <div class="sub" id="outroSub" style="top:660px">Scan · Check · Update — with OrangeOne</div>
  </div>
</div>
<script src="../shots/manifest.js"></script>
<script src="timeline.js"></script>
<script src="engine.js"></script>
</body>
</html>
