name: OrangeONE License Check
on:
  push:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      flutter_version: '3.47.5'
      runs_on: ubuntu-24.04
      allowed: 'MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0'
      dependency_type: 'direct-main,direct-dev,transitive'
      ignore_retrieval_failures: false
