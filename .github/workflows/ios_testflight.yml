name: iOS TestFlight
on:
  workflow_run:
    workflows: [Flutter Tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-testflight-production
  cancel-in-progress: false
jobs:
  beta:
    # Never sign a PR, fork, failed test run or non-main manual dispatch.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: bundle config set --local frozen true
      - run: bundle install
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      # Also validates manual retries and the exact checked-out main commit.
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - name: Build, sign and upload production IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        with:
          name: ios-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
