name: OrangeONE iOS Production Release
# Production TestFlight candidate from an approved, published GitHub Release of a
# version tag (vX.Y.Z) only. Branch pushes, merges and manual runs cannot start it.
# The build goes to Production Testers; Apple App Review submission stays the
# separate, manual ios.yaml operation and public release stays manual.
# Real uploads stay off until the repository variable PRODUCTION_RELEASE_ENABLED
# is 'true'; until then every release run is a dry run that signs and verifies.
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  # One delivery at a time so build numbers are allocated one after another.
  group: testflight-cd
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      flavor: ${{ steps.plan.outputs.flavor }}
      group: ${{ steps.plan.outputs.group }}
      environment: ${{ steps.plan.outputs.environment }}
      version: ${{ steps.plan.outputs.version }}
      build_floor: ${{ steps.plan.outputs.build_floor }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and main prove the tag is on main and its build number is new.
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the approved release tag
        id: plan
        env:
          PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
        run: python3 tool/ci/release_tags.py

  checks:
    # Failed, cancelled or unfinished required CI checks block signing.
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for every required check of this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 tool/ci/wait_for_checks.py

  allocate:
    needs: [plan, checks]
    environment: ${{ needs.plan.outputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      build_number: ${{ steps.allocate.outputs.build_number }}
    env:
      CHANNEL_FLAVOR: ${{ needs.plan.outputs.flavor }}
      TARGET_GROUP: ${{ needs.plan.outputs.group }}
      BUILD_NUMBER_FLOOR: ${{ needs.plan.outputs.build_floor }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      # Trusted control-plane files of the protected branch; no build happens here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: bundle config set --local frozen true
      - run: bundle install
      - name: Load only the App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: python3 tool/ci/ios_signing.py api-key
      - name: Check the tester groups and allocate the next build number
        id: allocate
        run: bundle exec fastlane ios allocate_build
      - name: Remove the temporary API key
        if: always()
        run: python3 tool/ci/ios_signing.py cleanup

  archive:
    # Secret-free: compiles the branch with its flavor and no credentials.
    needs: [plan, allocate]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FLAVOR: ${{ needs.plan.outputs.flavor }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.allocate.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          # Signing jobs must never consume a cache written by this compilation.
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Archive production, unsigned
        run: flutter build ipa --release --no-codesign --flavor production --target lib/main_production.dart --dart-define-from-file=config/production.example.json --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD_NUMBER"
      - name: Package unsigned archive as data
        run: ditto -c -k --norsrc --noextattr --keepParent build/ios/archive/Runner.xcarchive candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ needs.plan.outputs.flavor }}-candidate
          path: candidate.zip
          if-no-files-found: error
          retention-days: 1

  deliver:
    needs: [plan, allocate, archive]
    environment: ${{ needs.plan.outputs.environment }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_FLAVOR: production
      CHANNEL_FLAVOR: ${{ needs.plan.outputs.flavor }}
      TARGET_GROUP: ${{ needs.plan.outputs.group }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      TESTFLIGHT_CD_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.allocate.outputs.build_number }}
      BUILD_NUMBER_FLOOR: ${{ needs.plan.outputs.build_floor }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # Trusted control-plane files only; the archive is validated as data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: xcodebuild -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: bundle config set --local frozen true
      - run: bundle install
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ needs.plan.outputs.flavor }}-candidate
          path: ${{ runner.temp }}/candidate-download
      - name: Validate and unpack the archive without executing its code
        run: python3 tool/ci/prepare_archive.py
      - name: Import temporary Apple credentials
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: python3 tool/ci/ios_signing.py install
      - name: Sign and export; upload and assign to Production Testers unless dry run
        run: bundle exec fastlane ios testflight_channel
      - name: Summary
        run: |
          {
            echo "### Production TestFlight candidate"
            echo "- Flavor: ${{ needs.plan.outputs.flavor }}"
            echo "- Tester group: ${{ needs.plan.outputs.group }}"
            echo "- Version / build: ${{ needs.plan.outputs.version }} (${{ needs.allocate.outputs.build_number }})"
            echo "- Source commit: ${{ github.sha }}"
            echo "- Release tag: ${{ needs.plan.outputs.tag }}"
            echo "- Dry run: ${{ needs.plan.outputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.plan.outputs.flavor }}-${{ needs.plan.outputs.version }}-${{ needs.allocate.outputs.build_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing keychain, profile and API key
        if: always()
        run: python3 tool/ci/ios_signing.py cleanup
