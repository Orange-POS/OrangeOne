name: OrangeONE iOS - Unsigned and TestFlight
on:
  push:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Manual production distribution (workflow runs from main)
        required: true
        type: choice
        options: [testflight, submit_for_review]
      pr_number:
        description: Optional PR number for TestFlight; leave blank to build main
        required: false
        type: string
      version:
        description: Marketing version, e.g. 1.0.0
        required: true
        type: string
      build_number:
        description: Unique build integer 1-9999; for submission use the iPhone-tested build
        required: true
        type: string
      iphone_smoke_test_confirmed:
        description: The selected TestFlight build passed the documented physical iPhone checklist
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'distribution' || github.ref }}
  # Never interrupt signing/submission when another workflow is dispatched.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  ios:
    name: Unsigned production iOS
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Report Apple build tools
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --flavor production --target lib/main_production.dart --dart-define-from-file=config/production.example.json
      - name: Preserve unsigned app permissions and symlinks
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-production.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-production
          path: build/ios/unsigned-production.zip
          if-no-files-found: error
          retention-days: 7

  release_checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      pr_number: ${{ steps.source.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manual release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          IPHONE_SMOKE_TEST_CONFIRMED: ${{ inputs.iphone_smoke_test_confirmed }}
        uses: actions/github-script@v7
        with:
          script: |
            const e = process.env;
            if (context.ref !== 'refs/heads/main') throw new Error('Dispatch from main.');
            if (!/^\d+\.\d+\.\d+$/.test(e.RELEASE_VERSION) || !/^[1-9]\d{0,3}$/.test(e.RELEASE_BUILD_NUMBER))
              throw new Error('Use version x.y.z and a unique build number 1-9999.');
            if (e.PR_NUMBER.trim() && !/^[1-9]\d*$/.test(e.PR_NUMBER.trim())) throw new Error('Invalid PR number.');
            if (e.OPERATION === 'submit_for_review' && (e.PR_NUMBER.trim() || e.IPHONE_SMOKE_TEST_CONFIRMED !== 'true'))
              throw new Error('Submission requires no PR selection and confirmed iPhone testing.');
      - name: Resolve main or selected PR to an immutable commit
        id: source
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const number = process.env.PR_NUMBER.trim();
            let sha = context.sha;
            if (number) {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(number)});
              if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                  pr.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('Select an open PR targeting main in this repository.');
              }
              sha = pr.head.sha;
            }
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid source commit.');
            core.setOutput('sha', sha);
            core.setOutput('pr_number', number);
            await core.summary.addHeading('Production TestFlight source')
              .addTable([['Source', 'Commit'], [number ? `PR #${number}` : 'main', sha]])
              .write();
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: |
          ruby -c fastlane/Fastfile

  candidate:
    name: Compile and test selected production source
    needs: release_checks
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'testflight'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_checks.outputs.source_sha }}
          persist-credentials: false
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          # PR code must not publish caches later consumed by signing jobs.
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - name: Archive selected source without signing credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: flutter build ipa --release --no-codesign --flavor production --target lib/main_production.dart --dart-define-from-file=config/production.example.json --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD_NUMBER"
      - name: Package unsigned archive as data
        run: ditto -c -k --norsrc --noextattr --keepParent build/ios/archive/Runner.xcarchive candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-production-candidate
          path: candidate.zip
          if-no-files-found: error
          retention-days: 1

  beta:
    name: Sign production IPA and upload PR or main to TestFlight
    needs: [release_checks, candidate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'testflight'
    environment: ios-production
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PR_NUMBER: ${{ needs.release_checks.outputs.pr_number }}
      SOURCE_SHA: ${{ needs.release_checks.outputs.source_sha }}
    steps:
      # Trusted control-plane files only. Never checkout or execute PR source here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: xcodebuild -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # Do not restore a cache written by a PR compilation job.
          bundler-cache: false
      - run: bundle config set --local frozen true
      - run: bundle install
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-production-candidate
          path: ${{ runner.temp }}/candidate-download
      - name: Check that selected PR has not changed since compilation
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.release_checks.outputs.pr_number }}
          SOURCE_SHA: ${{ needs.release_checks.outputs.source_sha }}
        with:
          script: |
            if (process.env.PR_NUMBER) {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
              if (pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) {
                throw new Error('PR changed or closed; dispatch a new build and review its commit.');
              }
            }
      - name: Validate and unpack archive without executing PR code
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          """Validate a candidate archive as data before it reaches signing tools."""
          import os
          from pathlib import Path, PurePosixPath
          import plistlib
          import posixpath
          import stat
          import subprocess
          import zipfile


          def validate_zip(path):
              with zipfile.ZipFile(path) as archive:
                  for member in archive.infolist():
                      name = member.filename
                      parts = PurePosixPath(name).parts
                      if (not parts or parts[0] != 'Runner.xcarchive' or '..' in parts
                              or name.startswith('/') or '\\' in name):
                          raise ValueError('Archive contains an unsafe entry.')
                      mode = member.external_attr >> 16
                      if stat.S_ISLNK(mode):
                          target = archive.read(member).decode('utf-8')
                          resolved = posixpath.normpath(posixpath.join(posixpath.dirname(name), target))
                          if target.startswith('/') or not resolved.startswith('Runner.xcarchive/'):
                              raise ValueError('Archive contains an escaping symlink.')
                      elif stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR):
                          raise ValueError('Archive contains an unsupported file type.')


          def validate_app(archive, version, build_number):
              root = Path(archive)
              info = plistlib.loads((root / 'Info.plist').read_bytes())
              relative = info.get('ApplicationProperties', {}).get('ApplicationPath')
              if relative != 'Applications/Runner.app':
                  raise ValueError('Archive must contain the production Runner app.')
              app = root / 'Products' / relative
              details = plistlib.loads((app / 'Info.plist').read_bytes())
              if (details.get('CFBundleIdentifier') != 'com.orangeone.app'
                      or details.get('CFBundleShortVersionString') != version
                      or details.get('CFBundleVersion') != build_number):
                  raise ValueError('Candidate bundle/version/build does not match the manual request.')


          try:
              temporary = Path(os.environ['RUNNER_TEMP'])
              source = temporary / 'candidate-download/candidate.zip'
              validate_zip(source)
              destination = temporary / 'candidate'
              destination.mkdir(mode=0o700, exist_ok=True)
              subprocess.run(['/usr/bin/ditto', '-x', '-k', str(source), str(destination)], check=True)
              validate_app(destination / 'Runner.xcarchive', os.environ['RELEASE_VERSION'], os.environ['RELEASE_BUILD_NUMBER'])
          except (ValueError, OSError, KeyError, subprocess.SubprocessError, zipfile.BadZipFile):
              raise SystemExit('Candidate archive validation failed; no signing credentials were loaded.') from None
          PY
      - name: Sign IPA and upload using the seven Apple secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        with:
          name: ios-production-${{ inputs.version }}-${{ inputs.build_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing keychain, profile and API key
        if: always()
        run: bundle exec fastlane ios cleanup
  submit:
    needs: release_checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'submit_for_review'
    environment: ios-app-store
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      IPHONE_SMOKE_TEST_CONFIRMED: ${{ inputs.iphone_smoke_test_confirmed }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: bundle config set --local frozen true
      - run: bundle install
      - name: Submit the tested build for review
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: bundle exec fastlane ios submit
      - name: Remove API key
        if: always()
        run: bundle exec fastlane ios cleanup
