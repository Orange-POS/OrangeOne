name: iOS Unsigned
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --flavor production --target lib/main_production.dart --dart-define-from-file=config/production.example.json
      - run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-production.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-production
          path: build/ios/unsigned-production.zip
          if-no-files-found: error
          retention-days: 7
