name: Android APK
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # No Android distribution key was supplied. This APK is debug-signed.
      - run: flutter build apk --debug --flavor production --target lib/main_production.dart --dart-define-from-file=config/production.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-production-debug-apk
          path: build/app/outputs/flutter-apk/app-production-debug.apk
          if-no-files-found: error
          retention-days: 7
