name: orange_one
description: OrangeONE mobile inventory management application.
version: 1.1.0+35
publish_to: none
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.5 <4.0.0'
dependencies:
  connectivity_plus: 7.0.0
  cryptography: 2.7.0
  dio: ^5.11.1
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  intl: ^0.20.2
  mobile_scanner: ^7.4.2
  path_provider: 2.1.5
  permission_handler: 12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
